services:
  mongodb:
    image: mongo:7
    container_name: placementhub-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    image: aanyagupta/placementhub-backend:latest
    container_name: placementhub-backend
    restart: unless-stopped
    environment:
      PORT: "5000"
      MONGO_URI: mongodb://mongodb:27017/placementhub
      FRONTEND_URL: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
    image: aanyagupta/placementhub-frontend:latest
    container_name: placementhub-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

  prometheus:
    image: prom/prometheus
    container_name: placementhub-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend

volumes:
  mongodb_data: