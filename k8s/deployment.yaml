apiVersion: apps/v1
kind: Deployment
metadata:
  name: placementhub-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placementhub-mongodb
  template:
    metadata:
      labels:
        app: placementhub-mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placementhub-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placementhub-backend
  template:
    metadata:
      labels:
        app: placementhub-backend
    spec:
      containers:
        - name: backend
          image: aanyagupta/placementhub-backend:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: "mongodb://placementhub-mongodb:27017/placementhub"
            - name: FRONTEND_URL
              value: "http://localhost:30080"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: placementhub-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: placementhub-frontend
  template:
    metadata:
      labels:
        app: placementhub-frontend
    spec:
      containers:
        - name: frontend
          image: aanyagupta/placementhub-frontend:latest
          ports:
            - containerPort: 80