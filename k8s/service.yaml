apiVersion: v1
kind: Service
metadata:
  name: placementhub-mongodb
spec:
  selector:
    app: placementhub-mongodb
  ports:
    - port: 27017
      targetPort: 27017
---
apiVersion: v1
kind: Service
metadata:
  name: placementhub-backend
spec:
  selector:
    app: placementhub-backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: placementhub-frontend
spec:
  type: NodePort
  selector:
    app: placementhub-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080